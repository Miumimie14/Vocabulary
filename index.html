<script>
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v, shared: false } : null;
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
</script>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeWords(prefix, pairs) {

    { id: "ch57", title: "57 – Importance and degree", icon: "📘", words: makeWords("ch57", CH57_PAIRS) },

  ];
}

];

function computeStats(words) {
  const total = words.length;
  const known = words.filter((w) => w.status === "known").length;
  const review = total - known;
  return { total, known, review };
}

function VocabApp() {
  const [chapters, setChapters] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("reviser"); // reviser | ajouter | gerer
  const [screen, setScreen] = useState("home"); // home | session
  const [activeChapterId, setActiveChapterId] = useState(null); // null = ALL
  const [mode, setMode] = useState("flashcards");
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const d = await window.storage.get("vocab-chapters");
        const stored = d ? JSON.parse(d.value) : null;
        const withIcons = stored
          ? stored.map((c) => ({ ...c, icon: c.icon || "📁" }))
          : null;
        setChapters(withIcons && withIcons.length > 0 ? withIcons : seedChapters());
      } catch {
        setChapters(seedChapters());
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded || chapters === null) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      window.storage.set("vocab-chapters", JSON.stringify(chapters)).catch(() => {});
    }, 300);
  }, [chapters, loaded]);

  if (!loaded) {
    return <div style={{ padding: 40, color: INK_SOFT, fontFamily: "system-ui, sans-serif" }}>Chargement…</div>;
  }

  const allWords = chapters.flatMap((c) => c.words);

  function updateWordStatus(wordId, status) {
    setChapters((prev) =>
      prev.map((c) => ({
        ...c,
        words: c.words.map((w) => (w.id === wordId ? { ...w, status } : w)),
      }))
    );
  }

  function openChapter(id) {
    setActiveChapterId(id);
    setScreen("session");
  }

  function goHome() {
    setScreen("home");
    setActiveChapterId(null);
  }

  function goTab(t) {
    setTab(t);
    setScreen("home");
    setActiveChapterId(null);
  }

  const activeChapter = activeChapterId ? chapters.find((c) => c.id === activeChapterId) : null;
  const sessionWords = activeChapter ? activeChapter.words : allWords;

  return (
    <div style={{ fontFamily: "system-ui, -apple-system, Segoe UI, sans-serif", background: BG, color: INK, minHeight: "100%", padding: "0 0 40px" }}>
      <div style={{ padding: "28px 20px 0", maxWidth: 760, margin: "0 auto" }}>

        </div>

            setMode={setMode}
            onOpenChapter={openChapter}

        )}

function FlashcardMode({ words, onStatus, direction }) {
  const [order, setOrder] = useState(() => shuffle(words.map((w) => w.id)));
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);

  if (index >= order.length) {
    const known = words.filter((w) => w.status === "known").length;
    const review = words.filter((w) => w.status === "review").length;
    return (
      <div style={cardStyle}>
        <p style={{ marginTop: 0, fontWeight: 600 }}>Série terminée.</p>
        <StatsInline total={words.length} known={known} review={review} />
        <button
          style={btnAccent}
          onClick={() => { setOrder(shuffle(words.map((w) => w.id))); setIndex(0); setFlipped(false); }}
        >
          Recommencer une série
        </button>
      </div>
    );
  }

  const word = words.find((w) => w.id === order[index]);
  const front = direction === "fr-en" ? word.fr : word.en;
  const back = direction === "fr-en" ? word.en : word.fr;
  const known = words.filter((w) => w.status === "known").length;
  const review = words.filter((w) => w.status === "review").length;

  function mark(status) {
    onStatus(word.id, status);
    setFlipped(false);
    setIndex(index + 1);
  }

  return (
    <div>
      <div style={{ marginBottom: 12 }}>
        <StatsInline total={words.length} known={known} review={review} />
      </div>

      <div style={{ ...cardStyle, textAlign: "center", minHeight: 130, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
        onClick={() => setFlipped(!flipped)}
      >
        <div style={{ fontSize: 12, color: INK_SOFT, marginBottom: 8 }}>{index + 1} / {order.length}</div>
        <div style={{ fontFamily: "Georgia, serif", fontSize: 24, fontWeight: 700 }}>
          {flipped ? back : front}
        </div>
        {!flipped && <div style={{ fontSize: 12, color: INK_SOFT, marginTop: 10 }}>Touche la carte pour révéler</div>}
      </div>

      <div style={{ height: 14 }} />

      {flipped ? (
        <div style={{ display: "flex", gap: 10 }}>
          <button style={{ ...btnBase, flex: 1, background: RED_BG, color: RED, border: "none" }} onClick={() => mark("review")}>
            À revoir
          </button>
          <button style={{ ...btnBase, flex: 1, background: GREEN_BG, color: GREEN, border: "none" }} onClick={() => mark("known")}>
            Su
          </button>
        </div>
      ) : (
        <button style={btnGhost} onClick={() => setFlipped(true)}>Révéler la réponse</button>
      )}
    </div>
  );
}

const btnBase = {
  borderRadius: 8,
  padding: "11px 0",
  fontSize: 14,
  fontWeight: 600,
  cursor: "pointer",
};
const btnAccent = { ...btnBase, background: BLUE, color: "#FFFFFF", border: "none", marginTop: 10, padding: "10px 18px" };
const btnGhost = { ...btnBase, width: "100%", background: "none", border: `1px solid ${BORDER}`, color: INK };

function buildQuizRound(words, pool, direction) {
  const qField = direction === "fr-en" ? "fr" : "en";
  const aField = direction === "fr-en" ? "en" : "fr";
  const shuffled = shuffle(words);
  return shuffled.map((w) => {
    const distractorPool = pool.filter((p) => p.id !== w.id && p[aField] !== w[aField]);
    const distractors = shuffle(distractorPool).slice(0, 3).map((p) => p[aField]);
    const options = shuffle([w[aField], ...distractors]);
    return { word: w, options, question: w[qField], correct: w[aField] };
  });
}

function QCMMode({ words, pool, onStatus, direction }) {
  const [round, setRound] = useState(() => buildQuizRound(words, pool.length >= 4 ? pool : words, direction));
  const [index, setIndex] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);

  if (index >= round.length) {
    return (
      <div style={cardStyle}>
        <p style={{ marginTop: 0, fontWeight: 600 }}>Série terminée.</p>
        <div style={{ fontSize: 13, color: INK_SOFT, marginBottom: 10 }}>{score} / {round.length} bonnes réponses</div>
        <button
          style={btnAccent}
          onClick={() => { setRound(buildQuizRound(words, pool.length >= 4 ? pool : words, direction)); setIndex(0); setPicked(null); setScore(0); }}
        >
          Recommencer une série
        </button>
      </div>
    );
  }

  const q = round[index];
  const correct = q.correct;

  function pick(opt) {
    if (picked) return;
    setPicked(opt);
    const isRight = opt === correct;
    if (isRight) setScore((s) => s + 1);
    onStatus(q.word.id, isRight ? "known" : "review");
    setTimeout(() => {
      setPicked(null);
      setIndex((i) => i + 1);
    }, 700);
  }

  return (
    <div>
      <div style={{ fontSize: 12, color: INK_SOFT, marginBottom: 10 }}>{index + 1} / {round.length} — {score} bonnes réponses</div>
      <div style={{ ...cardStyle, textAlign: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 12, color: INK_SOFT, marginBottom: 8 }}>
          {direction === "fr-en" ? "Traduis en anglais :" : "Traduis en français :"}
        </div>
        <div style={{ fontFamily: "Georgia, serif", fontSize: 22, fontWeight: 700 }}>{q.question}</div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {q.options.map((opt) => {
          let bg = CARD, border = BORDER, color = INK;
          if (picked) {
            if (opt === correct) { bg = GREEN_BG; border = GREEN; color = GREEN; }
            else if (opt === picked) { bg = RED_BG; border = RED; color = RED; }
          }
          return (
            <button
              key={opt}
              onClick={() => pick(opt)}
              disabled={!!picked}
              style={{
                textAlign: "left",
                padding: "12px 14px",
                borderRadius: 10,
                border: `1.5px solid ${border}`,
                background: bg,
                color,
                fontSize: 14,
                cursor: picked ? "default" : "pointer",
              }}
            >
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function AssociationMode({ words, direction }) {
  const BATCH = 6;
  const leftField = direction === "fr-en" ? "fr" : "en";
  const rightField = direction === "fr-en" ? "en" : "fr";
  const [batch, setBatch] = useState(() => shuffle(words).slice(0, BATCH));
  const [leftOrder, setLeftOrder] = useState(() => shuffle(batch.map((w) => w.id)));
  const [rightOrder, setRightOrder] = useState(() => shuffle(batch.map((w) => w.id)));
  const [selectedLeft, setSelectedLeft] = useState(null);
  const [selectedRight, setSelectedRight] = useState(null);
  const [matched, setMatched] = useState([]);
  const [wrongPair, setWrongPair] = useState(null);

  function newRound() {
    const b = shuffle(words).slice(0, Math.min(BATCH, words.length));
    setBatch(b);
    setLeftOrder(shuffle(b.map((w) => w.id)));
    setRightOrder(shuffle(b.map((w) => w.id)));
    setSelectedLeft(null);
    setSelectedRight(null);
    setMatched([]);
    setWrongPair(null);
  }

  function pick(side, id) {
    if (matched.includes(id)) return;
    if (side === "left") setSelectedLeft(id);
    else setSelectedRight(id);
  }

  useEffect(() => {
    if (selectedLeft && selectedRight) {
      if (selectedLeft === selectedRight) {
        setMatched((m) => [...m, selectedLeft]);
        setSelectedLeft(null);
        setSelectedRight(null);
      } else {
        setWrongPair([selectedLeft, selectedRight]);
        setTimeout(() => {
          setWrongPair(null);
          setSelectedLeft(null);
          setSelectedRight(null);
        }, 500);
      }
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedLeft, selectedRight]);

  const done = matched.length === batch.length;

  return (
    <div>
      <div style={{ fontSize: 12, color: INK_SOFT, marginBottom: 10 }}>
        {matched.length} / {batch.length} paires trouvées
      </div>

      {done ? (
        <div style={cardStyle}>
          <p style={{ marginTop: 0, fontWeight: 600 }}>Série terminée.</p>
          <button style={btnAccent} onClick={newRound}>Nouvelle série</button>
        </div>
      ) : (
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 8 }}>
            {leftOrder.map((id) => {
              const w = batch.find((x) => x.id === id);
              const isMatched = matched.includes(id);
              const isSelected = selectedLeft === id;
              const isWrong = wrongPair && wrongPair[0] === id;
              return (
                <button
                  key={id}
                  disabled={isMatched}
                  onClick={() => pick("left", id)}
                  style={pairBtnStyle(isMatched, isSelected, isWrong)}
                >
                  {w[leftField]}
                </button>
              );
            })}
          </div>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 8 }}>
            {rightOrder.map((id) => {
              const w = batch.find((x) => x.id === id);
              const isMatched = matched.includes(id);
              const isSelected = selectedRight === id;
              const isWrong = wrongPair && wrongPair[1] === id;
              return (
                <button
                  key={id}
                  disabled={isMatched}
                  onClick={() => pick("right", id)}
                  style={pairBtnStyle(isMatched, isSelected, isWrong)}
                >
                  {w[rightField]}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function pairBtnStyle(isMatched, isSelected, isWrong) {
  let bg = CARD, border = BORDER, color = INK;
  if (isMatched) { bg = GREEN_BG; border = GREEN; color = GREEN; }
  else if (isWrong) { bg = RED_BG; border = RED; color = RED; }
  else if (isSelected) { bg = BLUE_LIGHT; border = BLUE; color = BLUE; }
  return {
    textAlign: "left",
    padding: "10px 12px",
    borderRadius: 8,
    border: `1px solid ${border}`,
    background: bg,
    color,
    fontSize: 13,
    cursor: isMatched ? "default" : "pointer",
    opacity: isMatched ? 0.6 : 1,
  };
}

function AjouterScreen({ chapters, setChapters }) {
  const [selectedChapter, setSelectedChapter] = useState(chapters[0]?.id || null);
  const [fr, setFr] = useState("");
  const [en, setEn] = useState("");
  const [bulk, setBulk] = useState("");
  const [err, setErr] = useState("");
  const [bulkMsg, setBulkMsg] = useState("");

  if (chapters.length === 0) {
    return <div style={cardStyle}><p style={{ margin: 0, color: INK_SOFT }}>Crée d'abord un dossier depuis l'onglet "Gérer".</p></div>;
  }

  function addWord() {
    if (!fr.trim() || !en.trim()) { setErr("Renseigne le mot en français et sa traduction."); return; }
    setChapters(chapters.map((c) => c.id === selectedChapter
      ? { ...c, words: [...c.words, { id: uid(), fr: fr.trim(), en: en.trim(), status: "new" }] }
      : c
    ));
    setFr(""); setEn(""); setErr("");
  }

  function importBulk() {
    if (!bulk.trim()) return;
    const lines = bulk.split("\n").map((l) => l.trim()).filter(Boolean);
    const newWords = [];
    for (const line of lines) {
      const sep = line.includes(";") ? ";" : line.includes("\t") ? "\t" : line.includes(" - ") ? " - " : line.includes(":") ? ":" : null;
      if (!sep) continue;
      const [f, e] = line.split(sep);
      if (f && e && f.trim() && e.trim()) {
        newWords.push({ id: uid(), fr: f.trim(), en: e.trim(), status: "new" });
      }
    }
    if (newWords.length === 0) {
      setBulkMsg("Aucune ligne reconnue. Format attendu : mot français ; traduction anglaise (une paire par ligne).");
      return;
    }
    setChapters(chapters.map((c) => c.id === selectedChapter
      ? { ...c, words: [...c.words, ...newWords] }
      : c
    ));
    setBulkMsg(`${newWords.length} mot${newWords.length > 1 ? "s" : ""} ajouté${newWords.length > 1 ? "s" : ""}.`);
    setBulk("");
  }

  return (
    <div style={cardStyle}>
      <div style={{ fontWeight: 600, marginBottom: 10 }}>Dossier</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
        {chapters.map((c) => (
          <TabBtn key={c.id} active={selectedChapter === c.id} onClick={() => setSelectedChapter(c.id)}>
            {c.icon} {c.title}
          </TabBtn>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        <input style={inputStyle} placeholder="Mot français" value={fr} onChange={(e) => setFr(e.target.value)} />
        <input style={inputStyle} placeholder="Traduction anglaise" value={en} onChange={(e) => setEn(e.target.value)} />
        <button style={btnAccent} onClick={addWord}>Ajouter</button>
      </div>
      {err && <div style={{ color: RED, fontSize: 12, marginTop: 6 }}>{err}</div>}

      <div style={{ fontSize: 12, color: INK_SOFT, margin: "16px 0 6px" }}>
        Import en masse — colle plusieurs lignes au format <code>mot français ; traduction anglaise</code> (une paire par ligne, séparateur ; ou : ou tiret)
      </div>
      <textarea
        style={{ ...inputStyle, minHeight: 90, fontFamily: "monospace", fontSize: 13, width: "100%" }}
        placeholder={"exemple\nla mondialisation ; globalization\nle chômage ; unemployment"}
        value={bulk}
        onChange={(e) => setBulk(e.target.value)}
      />
      <button style={{ ...btnAccent, marginTop: 8 }} onClick={importBulk}>Importer</button>
      {bulkMsg && <div style={{ fontSize: 12, color: INK_SOFT, marginTop: 6 }}>{bulkMsg}</div>}
    </div>
  );
}

  );
}

const ICON_CHOICES = ["📁", "📘", "📗", "🇬🇧", "🇺🇸", "🌱", "📚", "✏️", "📅", "🏛️", "🗣️", "📰"];

function GererScreen({ chapters, setChapters }) {
  const [newTitle, setNewTitle] = useState("");
  const [newIcon, setNewIcon] = useState("📁");
  const [selectedChapter, setSelectedChapter] = useState(chapters[0]?.id || null);
  const [err, setErr] = useState("");

  const chapter = chapters.find((c) => c.id === selectedChapter);

  function addChapter() {
    if (!newTitle.trim()) { setErr("Donne un nom au dossier."); return; }
    const c = { id: uid(), title: newTitle.trim(), icon: newIcon, words: [] };
    setChapters([...chapters, c]);
    setSelectedChapter(c.id);
    setNewTitle("");
    setErr("");
  }

  function deleteChapter(id) {
    setChapters(chapters.filter((c) => c.id !== id));
    if (selectedChapter === id) setSelectedChapter(null);
  }

  function deleteWord(wordId) {
    setChapters(chapters.map((c) => c.id === selectedChapter
      ? { ...c, words: c.words.filter((w) => w.id !== wordId) }
      : c
    ));
  }

  return (
    <div>
      <div style={{ ...cardStyle, marginBottom: 16 }}>
        <div style={{ fontWeight: 600, marginBottom: 10 }}>Dossiers</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
          {chapters.map((c) => (
            <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 4 }}>
              <TabBtn active={selectedChapter === c.id} onClick={() => setSelectedChapter(c.id)}>{c.icon} {c.title}</TabBtn>
              <button onClick={() => deleteChapter(c.id)} style={{ background: "none", border: "none", color: RED, cursor: "pointer", fontSize: 12 }}>✕</button>
            </div>
          ))}
        </div>

        <div style={{ fontSize: 12, color: INK_SOFT, marginBottom: 6 }}>Icône du nouveau dossier</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
          {ICON_CHOICES.map((ic) => (
            <button
              key={ic}
              onClick={() => setNewIcon(ic)}
              style={{
                width: 34, height: 34, borderRadius: 8, fontSize: 16, cursor: "pointer",
                border: `1.5px solid ${newIcon === ic ? BLUE : BORDER}`,
                background: newIcon === ic ? BLUE_LIGHT : CARD,
              }}
            >
              {ic}
            </button>
          ))}
        </div>

        <div style={{ display: "flex", gap: 8 }}>
          <input
            style={inputStyle}
            placeholder="Nom du nouveau dossier (ex. Enjeux contemporains)"
            value={newTitle}
            onChange={(e) => { setNewTitle(e.target.value); setErr(""); }}
            onKeyDown={(e) => e.key === "Enter" && addChapter()}
          />
          <button style={btnAccent} onClick={addChapter}>Créer</button>
        </div>
        {err && <div style={{ color: RED, fontSize: 12, marginTop: 6 }}>{err}</div>}
      </div>

      {chapter && (
        <div style={cardStyle}>
          <div style={{ fontWeight: 600, marginBottom: 10 }}>{chapter.icon} {chapter.words.length} mot{chapter.words.length > 1 ? "s" : ""} dans "{chapter.title}"</div>
          {chapter.words.length === 0 && <div style={{ fontSize: 13, color: INK_SOFT }}>Aucun mot pour l'instant. Ajoute-en depuis l'onglet "Ajouter".</div>}
          {chapter.words.map((w) => (
            <div key={w.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: `1px solid ${BORDER}` }}>
              <span style={{ fontSize: 13 }}>{w.fr} — {w.en}</span>
              <button onClick={() => deleteWord(w.id)} style={{ background: "none", border: "none", color: RED, cursor: "pointer", fontSize: 12 }}>Supprimer</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const inputStyle = {
  flex: 1,
  border: `1px solid ${BORDER}`,
  borderRadius: 8,
  padding: "9px 12px",
  fontSize: 14,
  fontFamily: "inherit",
  background: BG,
  color: INK,
  boxSizing: "border-box",
};

document.getElementById("root").dataset.mounted = "true";
document.getElementById("root").innerHTML = "";
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<VocabApp />);
</script>
</body>
</html>
